<!DOCTYPE html>
<html>
<head>

    <title>ADVANCED JAMB ENGLISH | KELVIN THE DESIGNER</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        :root { --dev-blue: #00d4ff; --bg: #030508; --card: rgba(255, 255, 255, 0.07); --accent: #ff007a; --success: #00ff88; --wa-green: #25d366; --fail: #ff4444; }
        body { background: var(--bg); color: #fff; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 0; }
        #app-wrapper { width: 92%; max-width: 800px; margin: auto; padding: 20px 0; }
        .dev-header { text-align: center; padding: 20px; border-bottom: 2px solid var(--dev-blue); margin-bottom: 25px; background: rgba(0,212,255,0.05); border-radius: 0 0 20px 20px; }
        .dev-header h1 { margin: 0; color: var(--dev-blue); font-size: 1.6em; text-transform: uppercase; letter-spacing: 2px; }
        .glass { background: var(--card); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.1); border-radius: 18px; padding: 25px; margin-bottom: 20px; box-shadow: 0 8px 32px rgba(0,0,0,0.3); }
        .name-input { width: 100%; padding: 12px; margin: 15px 0; border-radius: 8px; border: 1px solid var(--dev-blue); background: rgba(0,0,0,0.5); color: #fff; box-sizing: border-box; outline: none; }
        #nav-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(38px, 1fr)); gap: 6px; margin-bottom: 20px; max-height: 160px; overflow-y: auto; padding: 10px; background: rgba(0,0,0,0.5); border-radius: 12px; }
        .nav-dot { height: 32px; background: #1a1a1a; border: 1px solid #333; display: flex; align-items: center; justify-content: center; border-radius: 6px; cursor: pointer; font-size: 0.7em; }
        .nav-dot.active { border-color: var(--dev-blue); background: rgba(0,212,255,0.2); }
        .nav-dot.answered { background: var(--dev-blue); color: #000; font-weight: bold; }
        .opt-label { display: flex; align-items: center; background: rgba(255,255,255,0.04); padding: 15px; margin: 10px 0; border-radius: 10px; cursor: pointer; border: 1px solid transparent; }
        .opt-label.selected { border-color: var(--dev-blue); background: rgba(0,212,255,0.1); }
        input[type="radio"] { display: none; }
        .btn { padding: 14px; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; width: 100%; }
        .btn-main { background: var(--dev-blue); color: #000; }
        .btn-disabled { background: #1a1a1a !important; color: #444 !important; cursor: not-allowed; border: 1px solid #333; }
        .wa-btn { position: fixed; bottom: 20px; right: 20px; background: var(--wa-green); color: white; padding: 12px 20px; border-radius: 30px; text-decoration: none; font-weight: bold; z-index: 1000; }
        .hidden { display: none; }
        .review-card { border-left: 6px solid transparent; margin-bottom: 15px; text-align: left; }
        .review-correct { border-left-color: var(--success); }
        .review-wrong { border-left-color: var(--fail); }
        footer { text-align: center; color: #555; font-size: 0.75em; padding: 20px; }
    </style>
</head>
<body onload="loadBest()">

<a href="https://wa.me/2349032320783" class="wa-btn" target="_blank">MESSAGE THE DESIGNER</a>

<div id="app-wrapper">
    <div class="dev-header">
        <img src="logo.png" alt="Kelvin Logo" style="height: 60px; margin-bottom: 10px;">
        <h1>KELVIN THE DESIGNER</h1>
        <p>Advanced Use of English • 60 Unique Questions</p>
    </div>

    <div id="start-page" class="glass" style="text-align: center;">
        <h2 style="color:var(--dev-blue)">JAMB ENGLISH CBT</h2>
        <input type="text" id="user-name" class="name-input" placeholder="Enter Full Name...">
        <div id="best-score" style="margin: 10px 0; font-weight: bold; color: var(--success);"></div>
        <button class="btn btn-main" onclick="initExam()">START 30-MINUTE EXAM</button>
    </div>

    <div id="exam-page" class="hidden">
        <div id="timer" style="text-align:center; font-size: 1.8em; color: var(--accent); font-weight: 800; margin-bottom: 10px;">30:00</div>
        <div id="nav-grid"></div>
        <div class="glass">
            <div id="q-text" style="font-size: 1.1em; line-height: 1.5; margin-bottom: 15px;"></div>
            <div id="options-area"></div>
            <div style="display:flex; gap:10px; margin-top:20px;">
                <button class="btn" style="background:#222; color:#fff;" onclick="nav(-1)">PREV</button>
                <button class="btn btn-main" onclick="nav(1)">NEXT</button>
            </div>
        </div>
        <button class="btn" style="background:var(--success); color:#000; margin-top:10px;" onclick="finalize()">SUBMIT EXAM</button>
    </div>

    <div id="result-page" class="hidden">
        <div class="glass" style="text-align:center;">
            <h1 id="final-score" style="font-size:4em; margin:10px 0;">0 / 60</h1>
            <p id="sync-status" style="font-size: 0.9em; color: var(--dev-blue); margin-bottom: 15px;">Syncing with Designer's Database...</p>
            <button id="restart-btn" class="btn btn-disabled" disabled onclick="location.reload()">RESTART (1:30)</button>
        </div>
        <h3 style="text-align:center; color:var(--dev-blue); text-transform: uppercase; letter-spacing: 1px;">Exam Review</h3>
        <div id="review-list"></div>
    </div>

    <footer>&copy; 2026 Kelvin the Designer. Lagos, Nigeria.</footer>
</div>

<script>
const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbypAjBMxjI7fOJshx64Qq0_r2XYPxYgatKbgPd-IGTQugF5iKdVfFd2vlC26QIurakNag/exec";

const masterDB = [
    {q:"Which of the following contains the sound /ʧ/?", a:"Chastity", ops:["Chassis","Champagne","Chastity","Character"]},
    {q:"Choose the correct concord: A range of mountains ______ visible from the balcony.", a:"Is", ops:["Is","Are","Were","Have been"]},
    {q:"Pick the option that has a different stress pattern from the others.", a:"Understand", ops:["Education","Understand","Television","Organization"]},
    {q:"Complete the sentence: It's time we ______ the truth about the situation.", a:"Told", ops:["Tell","Told","Telling","Have told"]},
    {q:"Choose the correct tag: You'd rather I didn't go, ______?", a:"Wouldn't you", ops:["Hadn't you","Wouldn't you","Did you","Don't you"]},
    {q:"Which word is stressed on the first syllable?", a:"Preference", ops:["Preference","Predict","Prevent","Prepare"]},
    {q:"Neither the students nor their lecturer ______ the date of the exam.", a:"Knows", ops:["Know","Knows","Are knowing","Have known"]},
    {q:"Identify the meaning of the idiom: 'To bark up the wrong tree'.", a:"To follow a wrong line of thought", ops:["To shout at a tree","To be confused","To follow a wrong line of thought","To be angry"]},
    {q:"Select the word with the same vowel sound as 'Quay'.", a:"See", ops:["Key","See","Play","May"]},
    {q:"Complete the gap: The police ______ searching for the escaped convict.", a:"Are", ops:["Is","Are","Was","Has"]},
    {q:"Which word has a silent 'p'?", a:"Psychology", ops:["Puppy","Psychology","Paper","Prepare"]},
    {q:"Choose the correct form: If he ______ harder, he would have passed.", a:"Had studied", ops:["Studied","Has studied","Had studied","Was studying"]},
    {q:"What is the grammatical name for the underlined part: The boy <u>who stole the bread</u> was caught.", a:"Adjectival Clause", ops:["Noun Clause","Adjectival Clause","Adverbial Clause","Prepositional Phrase"]},
    {q:"Identify the word with a different consonant sound.", a:"Ghost", ops:["Ghost","Graph","Rough","Enough"]},
    {q:"The news of the accident ______ spreading like wildfire.", a:"Is", ops:["Is","Are","Were","Be"]},
    {q:"Which word has the stress on the second syllable?", a:"Enjoy", ops:["Enjoy","Teacher","Student","Table"]},
    {q:"Choose the most appropriate option: You are not supposed to be here, ______?", a:"Are you", ops:["Aren't you","Are you","Do you","Don't you"]},
    {q:"Identify the meaning: 'A storm in a teacup'.", a:"A lot of fuss over something small", ops:["A big disaster","A rainy day","A lot of fuss over something small","A hot tea"]},
    {q:"He is one of the candidates who ______ for the post.", a:"Are contesting", ops:["Is contesting","Are contesting","Contests","Was contesting"]},
    {q:"Which word has the same sound as /ð/ in 'This'?", a:"Them", ops:["Thin","Them","Think","Through"]},
    {q:"Complete the sentence: Scarcely ______ the room when the phone rang.", a:"Had he entered", ops:["He entered","Did he enter","Had he entered","Was he entering"]},
    {q:"Identify the stressed syllable in 'PARTICULAR'.", a:"-TIC-", ops:["PAR-","-TIC-","-U-","-LAR"]},
    {q:"The quality of these shoes ______ very high.", a:"Is", ops:["Is","Are","Were","Be"]},
    {q:"Choose the correct spelling.", a:"Manoeuvre", ops:["Manoeuvre","Maneuver","Manouvre","Manoevre"]},
    {q:"Which sound is heard in 'Bury'?", a:"/e/", ops:["/u:/","/ʊ/","/e/","/ʌ/"]},
    {q:"Identify the idiom: 'To pull someone's leg'.", a:"To tease someone", ops:["To trip someone","To tease someone","To help someone","To run fast"]},
    {q:"The number of people at the stadium ______ enormous.", a:"Was", ops:["Was","Were","Are","Be"]},
    {q:"Which word contains a silent 't'?", a:"Hustle", ops:["Title","Hustle","Total","Timid"]},
    {q:"I ______ my breakfast before he arrived.", a:"Had finished", ops:["Finished","Have finished","Had finished","Was finishing"]},
    {q:"Stress on the third syllable: INTERRUPT.", a:"-RUPT", ops:["IN-","-TER-","-RUPT","None"]},
    {q:"Each of the houses ______ painted white.", a:"Is", ops:["Is","Are","Were","Be"]},
    {q:"Which of these has the sound /ɔ:/?", a:"Caught", ops:["Cot","Caught","Cat","Cut"]},
    {q:"Identify the grammatical function: <u>Since he left</u>, I haven't seen him.", a:"Adverbial Clause of Time", ops:["Noun Clause","Adjectival Clause","Adverbial Clause of Time","Prepositional Phrase"]},
    {q:"The scissors ______ sharp.", a:"Are", ops:["Is","Are","Was","Has"]},
    {q:"Meaning of: 'To let the cat out of the bag'.", a:"To reveal a secret", ops:["To find a secret","To reveal a secret","To be careless","To play a game"]},
    {q:"Which word has the same sound as 'Phlegm'?", a:"Flame", ops:["Flame","Gem","Pledge","Farm"]},
    {q:"Choose the correct tag: Let's go to the party, ______?", a:"Shall we", ops:["Will we","Shall we","Don't we","Can we"]},
    {q:"He acted ______ he were the boss.", a:"As if", ops:["Like","As if","As","Though"]},
    {q:"Silent letter in 'Isle'?", a:"S", ops:["I","S","L","E"]},
    {q:"Concord check: Ten miles ______ a long distance.", a:"Is", ops:["Is","Are","Were","Be"]},
    {q:"Stress on the first syllable: CRITICIZE.", a:"CRIT-", ops:["CRIT-","-I-","-SIZE","None"]},
    {q:"The jury ______ divided in their opinions.", a:"Were", ops:["Is","Was","Were","Has"]},
    {q:"Meaning: 'To hit the nail on the head'.", a:"To say exactly the right thing", ops:["To build something","To say exactly the right thing","To be angry","To fix a door"]},
    {q:"Which word contains the sound /ʌ/?", a:"Blood", ops:["Look","Blood","Book","Food"]},
    {q:"The teacher, along with his students, ______ coming.", a:"Is", ops:["Is","Are","Were","Be"]},
    {q:"Silent letter in 'Gnaw'?", a:"G", ops:["G","N","A","W"]},
    {q:"Identify the word with the stress on the penultimate syllable.", a:"Condition", ops:["Condition","Photograph","Educate","Manage"]},
    {q:"'The bread and butter of the family ______ provided by the father.'", a:"Is", ops:["Is","Are","Were","Be"]},
    {q:"Which sound is in 'Plumb'?", a:"/m/", ops:["/b/","/m/","/p/","/n/"]},
    {q:"Meaning: 'Once in a blue moon'.", a:"Very rarely", ops:["Every month","Very rarely","At night","Sometimes"]},
    {q:"I look forward to ______ you soon.", a:"Seeing", ops:["See","Seeing","Seen","Saw"]},
    {q:"Silent letter in 'Castle'?", a:"T", ops:["C","S","T","L"]},
    {q:"Choose the correct concord: Statistics ______ a difficult subject.", a:"Is", ops:["Is","Are","Were","Be"]},
    {q:"Which word is stressed on the last syllable?", a:"Believe", ops:["Table","Teacher","Believe","Student"]},
    {q:"Meaning: 'To pay through the nose'.", a:"To pay too much", ops:["To pay on time","To pay through a bank","To pay too much","To be stingy"]},
    {q:"Identify the sound /ʒ/ in which word?", a:"Measure", ops:["Measure","Mission","Match","Marsh"]},
    {q:"The cattle ______ grazing in the field.", a:"Are", ops:["Is","Are","Was","Has"]},
    {q:"Silent letter in 'Hymn'?", a:"N", ops:["H","Y","M","N"]},
    {q:"Complete: No sooner ______ the bell rung than the pupils left.", a:"Had", ops:["Has","Had","Did","Was"]},
    {q:"Stress pattern: PHOTOGRAPH (v) vs PHOTOGRAPH (n). Stressed syllable for the noun?", a:"PHO-", ops:["PHO-","-TO-","-GRAPH","None"]}
];

let quiz = []; let idx = 0; let stored = {}; let time = 1800; let ticker; let studentName = "";

function loadBest() {
    let b = localStorage.getItem('k_dev_eng_adv') || 0;
    document.getElementById('best-score').innerText = `Personal Best: ${b}/60`;
}

function initExam() {
    studentName = document.getElementById('user-name').value;
    if(!studentName) { alert("Designer says: Enter name first!"); return; }
    document.getElementById('start-page').classList.add('hidden');
    document.getElementById('exam-page').classList.remove('hidden');
    quiz = masterDB.slice(0, 60); 
    drawNav(); render();
    ticker = setInterval(() => {
        time--; let m = Math.floor(time/60); let s = time%60;
        document.getElementById('timer').innerText = `${m}:${s<10?'0':''}${s}`;
        if(time <= 0) finalize();
    }, 1000);
}

function render() {
    let item = quiz[idx];
    document.getElementById('q-text').innerHTML = `<b>QUESTION ${idx+1}:</b><br>${item.q}`;
    let oh = '';
    item.ops.forEach(o => {
        oh += `<label class="opt-label ${stored[idx]===o?'selected':''}">
            <input type="radio" name="eng" value="${o}" onchange="pick('${o}')" ${stored[idx]===o?'checked':''}> ${o}
        </label>`;
    });
    document.getElementById('options-area').innerHTML = oh;
    drawNav();
}

function pick(v) { stored[idx] = v; render(); }
function goTo(i) { idx = i; render(); }
function nav(d) { idx += d; if(idx < 0) idx = 0; if(idx > 59) idx = 59; render(); }
function drawNav() {
    let h = ''; quiz.forEach((_, i) => {
        h += `<div class="nav-dot ${i===idx?'active':''} ${stored[i]?'answered':''}" onclick="goTo(${i})">${i+1}</div>`;
    });
    document.getElementById('nav-grid').innerHTML = h;
}

function finalize() {
    clearInterval(ticker);
    let score = 0;
    let reviewHTML = "";

    quiz.forEach((itm, i) => {
        let userAns = stored[i] || "No Answer";
        let isCorrect = (userAns === itm.a);
        if(isCorrect) score++;

        reviewHTML += `
        <div class="glass review-card ${isCorrect ? 'review-correct' : 'review-wrong'}">
            <b style="color:var(--dev-blue)">QUESTION ${i+1}:</b><br>
            <p>${itm.q}</p>
            <div style="font-size:0.95em; background: rgba(0,0,0,0.2); padding: 10px; border-radius: 8px;">
                <span style="color:${isCorrect ? 'var(--success)' : 'var(--fail)'}">
                    <b>Your Answer:</b> ${userAns} ${isCorrect ? '✔' : '✘'}
                </span><br>
                ${!isCorrect ? `<b>Correct Choice:</b> <span style="color:var(--success)">${itm.a}</span>` : ''}
            </div>
        </div>`;
    });

    document.getElementById('exam-page').classList.add('hidden');
    document.getElementById('result-page').classList.remove('hidden');
    document.getElementById('final-score').innerText = `${score} / 60`;
    document.getElementById('review-list').innerHTML = reviewHTML;
    
    localStorage.setItem('k_dev_eng_adv', score);

    // BACKGROUND DATA SYNC
    const formData = new URLSearchParams();
    formData.append('name', studentName);
    formData.append('score', score + "/60");
    formData.append('subject', "English_Advanced");
    formData.append('date', new Date().toLocaleString());

    fetch(WEB_APP_URL, {
        method: "POST",
        mode: "no-cors",
        keepalive: true,
        body: formData.toString()
    });

    startRestartCountdown(90); // 90 seconds = 1 minute 30 seconds
}

function startRestartCountdown(seconds) {
    let timeLeft = seconds;
    const btn = document.getElementById('restart-btn');
    const status = document.getElementById('sync-status');
    
    const interval = setInterval(() => {
        timeLeft--;
        let m = Math.floor(timeLeft / 60);
        let s = timeLeft % 60;
        
        btn.innerText = `RESTART (${m}:${s < 10 ? '0' : ''}${s})`;
        
        if(timeLeft <= 0) {
            clearInterval(interval);
            btn.innerText = "RESTART EXAM";
            btn.disabled = false;
            btn.classList.remove('btn-disabled');
            btn.classList.add('btn-main');
            status.innerText = "Database sync finalized. You can now restart.";
            status.style.color = "var(--success)";
        }
    }, 1000);
}
</script>
</body>
</html>
